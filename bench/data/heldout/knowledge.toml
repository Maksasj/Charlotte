suite = "heldout-knowledge"
about = """Held-out test for learning and asking about things (generic relations, articles, 'what do you know \
about X', remarks that are not facts). Written after the knowledge rules of 2026-11-27, never used for fixes: if it \
ever is, move it to split = "dev" and write a new one. Tags: listed = verbs/forms the rules cover, new things; \
new-wording = relations or phrasings the rules do not cover; remark = must not be learned as a fact."""
split = "test"
labels = "written by claude-opus-5.5 on 2026-11-27, before running it once; not tuned on"

