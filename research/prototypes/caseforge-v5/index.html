function solveSub(sp,hist,full){

 if(S.settings.patternFirst){
  var p=recognize(intent,slots);
  if(p){
   var b=bindRoles(p,intent,slots),r=interpret(p,b);
   var a=b.atom?byId(b.atom):null;
   base.pattern=p.id;base.atom=b.atom;base.shape=p.shape;base.binding=b;base.steps=r.steps;
   base.domain=a?a.domain:(b.record?b.record.domain:"general");
   base.mode=r.mode;base.text=r.text;base.missing=r.missing;
   base.sig=r.steps.filter(function(x){return x.hit}).map(function(x){return x.op}).join(">")||r.mode;
   p.uses=(p.uses||0)+1;p.lastUsed=now();
   log("BIND","#"+p.id+" "+p.name+" · atom "+(b.atom?"#"+b.atom:"none")+" · "+Object.keys(slots).length+" slots bound");
   log("RUN",r.mode+" via "+base.sig+(r.missing.length?" · asking "+r.missing.join(","):""));
   return base;
  }
 }
 var ranked=rankMoves(intent,sp.text);
 var top=ranked[0];
 if(top&&top.sc>=S.settings.threshold/100){
  var m=top.c,asks=m.asks||[],miss=asks.filter(function(k){return !slots[k]});
  var txt=m.reply;for(var k in slots)txt=txt.split("{"+k+"}").join(slots[k]);
  var left=(txt.match(/\{(\w+)\}/g)||[]).map(function(x){return x.slice(1,-1)});
  if(miss.length||left.length){
   var need=miss.concat(left).filter(function(v,i,arr){return arr.indexOf(v)===i});
   var q=need.map(function(n){return (SLOTS[n]&&SLOTS[n].prompt)||("Could you share "+n+"?")}).join(" ");
   base.move=m.id;base.mode="clarify";base.text=q;base.missing=need;base.sig="ask";base.shape="move";
   return base;

  base.move=m.id;base.mode="direct";base.text=txt;base.missing=[];base.sig="direct";base.shape="move";base.sc=top.sc;

 }
 base.mode="cold";base.text="";base.missing=[];base.sig="cold";

function mergeSubs(solved,info){

 var rank=function(s){return order&&order.indexOf(s.intent)>=0?order.indexOf(s.intent):-((PRIO[s.intent]||1)*100)+solved.indexOf(s)};
 var sorted=solved.slice().sort(function(a,b){return rank(a)-rank(b)});
 var parts=[],missing=[],cold=[],seen={};
 sorted.forEach(function(s){
  if(conflict&&(s.intent==="cancel"||s.intent==="pause")){s.mode="conflict";return}

  else out+=" "+((SLOTS[missing[0]]&&SLOTS[missing[0]].prompt)||("Could you share "+missing[0]+"?"));

}

function submitTeach(){
 var t=S.ui.teach.tab,msg=$("#teachMsg"),e=null;
 var fail=function(m){if(msg)msg.innerHTML='<div class="fmsg">'+icon("warn",14)+" "+m+"</div>";FX.play("deny")};
 if(t==="pattern"){
  if(!TE.pattern.name.trim()||!TE.pattern.intents.length)return fail("A pattern needs a name and at least one trigger intent.");
  e=createCase({kind:"pattern",name:TE.pattern.name.trim(),shape:TE.pattern.shape,intents:TE.pattern.intents.slice(),skeleton:clone(SKEL[TE.pattern.shape]),learned:{askOrder:[],batch:false,proactive:true,mergeOrder:TE.pattern.intents.slice()},trust:TE.pattern.trust/100,source:"taught",verified:TE.pattern.trust>=85});
  TE.pattern={name:"",shape:"gated",intents:[],trust:80};
 }else if(t==="atom"){
  if(!TE.atom.predicate.trim()||!TE.atom.payload.trim())return fail("An atom needs a predicate and a payload.");
  var cs=TE.atom.conditions.filter(function(c){return String(c.slot).trim()});
  var sl=[],seen={};cs.forEach(function(c){if(!seen[c.slot]){seen[c.slot]=1;var d=SLOTS[c.slot]||{type:"text",prompt:"Tell me "+c.slot+"?"};sl.push({name:c.slot,type:d.type,prompt:d.prompt})}});
  e=createCase({kind:"atom",predicate:TE.atom.predicate.trim(),object:TE.atom.object.trim()||"item",domain:TE.atom.domain.trim()||"general",conditions:cs.map(function(c){return{slot:c.slot.trim(),op:c.op,value:isNaN(parseFloat(c.value))?(String(c.value)==="true"?true:String(c.value)==="false"?false:c.value):parseFloat(c.value)}}),slots:sl,payload:TE.atom.payload.trim(),result:TE.atom.result.trim()||"grant",trust:TE.atom.trust/100,source:"taught",verified:TE.atom.trust>=85});
  TE.atom={predicate:"refund",object:"order",domain:"general",conditions:[{slot:"days",op:"<=",value:"30"}],payload:"",result:"grant",trust:70};
 }else if(t==="split"){
  var ms=TE.split.markers.split(/\n+/).map(function(x){return x.trim()}).filter(Boolean);
  if(!ms.length)return fail("Add at least one cut connector.");
  e=createCase({kind:"split",name:TE.split.name.trim()||("cut: "+ms[0]),intents:TE.split.intents.split(",").map(function(x){return x.trim()}).filter(Boolean),markers:ms,trust:TE.split.trust/100,source:"taught",verified:TE.split.trust>=85});
  TE.split={name:"",intents:"",markers:"",trust:80};
 }else{
  if(TE.move.current.trim().length<4||TE.move.reply.trim().length<6)return fail("Both the message and the reply need real content.");
  e=createCase({kind:"move",current:TE.move.current.trim(),reply:TE.move.reply.trim(),asks:TE.move.asks.split(",").map(function(x){return x.trim()}).filter(Boolean),trust:TE.move.trust/100,source:"taught",verified:TE.move.trust>=85});
  TE.move={current:"",reply:"",intent:"unknown",asks:"",trust:80};
 }
 S.stats.taught++;pushHist();save();renderNav();FX.play("teach");
 log("RETAIN","taught "+e.kind+" #"+e.id);
 renderTeach();
 toast(e.kind+' <b class="mono">#'+e.id+"</b> is in memory.","success",{label:"View",fn:function(){navTo("knowledge");S.ui.kb.kind=e.kind;renderKnowledge();openDrawer(e.id)}});
}

function parseConds(s){
 var t=s.toLowerCase(),c=[];
 var m=t.match(/within (\d+) (day|week|month|year)s?/);
 if(m){var n=parseInt(m[1],10)*mult(m[2]);c.push(m[2]==="month"||m[2]==="year"?{slot:"term",op:"<=",value:m[2]==="year"?parseInt(m[1],10)*12:parseInt(m[1],10)}:{slot:"days",op:"<=",value:n})}
 if(/original packaging|unopened|sealed/.test(t))c.push({slot:"packaging",op:"==",value:"original"});
 if(/opened items/.test(t))c.push({slot:"packaging",op:"==",value:"opened"});
 if(/once activated/.test(t))c.push({slot:"activated",op:"==",value:true});
 if(/without a receipt|without receipt/.test(t))c.push({slot:"receipt",op:"==",value:false});
 else if(/with a receipt|with receipt/.test(t))c.push({slot:"receipt",op:"==",value:true});
 m=t.match(/under \$(\d+)/);if(m)c.push({slot:"amount",op:"<=",value:parseInt(m[1],10)});
 m=t.match(/at least (\d+) (day|week)s? notice/);if(m)c.push({slot:"notice",op:">=",value:parseInt(m[1],10)*mult(m[2])});
 if(/short notice/.test(t))c.push({slot:"notice",op:"<",value:14});
 if(/seats are available/.test(t))c.push({slot:"seats",op:">=",value:1});
 if(/no seats remain/.test(t))c.push({slot:"seats",op:"==",value:0});
 if(/pro tier/.test(t))c.push({slot:"tier",op:"==",value:"pro"});
 if(/unverified accounts/.test(t))c.push({slot:"verified",op:"==",value:false});
 else if(/account is verified/.test(t))c.push({slot:"verified",op:"==",value:true});
 if(/coverage arranged/.test(t))c.push({slot:"coverage",op:"==",value:true});
 if(/drops or water/.test(t))c.push({slot:"misuse",op:"==",value:true});
 else if(/defective/.test(t))c.push({slot:"misuse",op:"==",value:false});
 var seen={},out=[];c.forEach(function(x){var k=x.slot+x.op;if(!seen[k]){seen[k]=1;out.push(x)}});

}
function mineArticle(text){

  var h=lines[0].match(/^#{1,3}\s+(.*)$/);if(!h)continue;
  var meta=headPred(h[1]);if(!meta)continue;
  var body=lines.slice(1).join(" ").replace(/\s+/g," ").trim();
  var sents=body.match(/[^.!?]+[.!?]+/g)||[body];
  for(var j=0;j<sents.length;j++){
   var sent=sents[j].trim();if(sent.length<16)continue;

   var alt=/instead/i.test(sent);
   var sl=[],seen={};
   cs.forEach(function(c){if(!seen[c.slot]){seen[c.slot]=1;var d=SLOTS[c.slot]||{type:"text",prompt:"Tell me "+c.slot+"?"};sl.push({name:c.slot,type:d.type,prompt:d.prompt})}});

   out.push({predicate:meta.p,object:meta.o,domain:meta.d,conditions:cs,slots:sl,payload:sent,result:denied?"denied":alt?"alternative":"grant",priority:alt?1:3,indexes:["is my "+meta.o+" eligible for "+meta.p,meta.p+" policy for "+meta.o],provenance:{source:"article · "+h[1],span:[0,sent.length]},trust:denied?.66:alt?.62:.68,quality:cs.length>0&&sent.length>25,dup:dup});

function mineChats(text){
